apiVersion: v1
kind: ConfigMap
metadata: {name: web-config, namespace: shop}
data:
  nginx.conf: |
    server { listen 80; }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: shop
spec:
  template:
    spec:
      serviceAccountName: web-sa
      containers:
        - name: web
          image: nginx:1.25
          envFrom:
            - configMapRef: {name: web-config}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web-sa
