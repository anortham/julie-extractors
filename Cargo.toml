[workspace]
members = [
    "crates/julie-extract-artifact",
    "crates/julie-extract-cli",
    "crates/julie-extractors",
    "xtask",
]
exclude = [
    "vendor/tree-sitter-regex",
    "vendor/tree-sitter-powershell",
    "vendor/tree-sitter-erlang",
    "vendor/tree-sitter-vb-dotnet",
    "vendor/tree-sitter-sequel-tsql",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/anortham/julie-extractors"
rust-version = "1.95"

[workspace.lints.rust]
unsafe_code = "forbid"
