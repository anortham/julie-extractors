name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  fast-gates:
    name: Fast Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Check workspace metadata
        run: cargo metadata --format-version 1

      - name: Check dependency policy
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

      - name: Check clippy
        run: >-
          cargo clippy --workspace --all-targets --all-features
          --no-deps -- -D warnings

      - name: Check agent guidance sync
        run: scripts/check-agent-doc-sync.sh

      - name: Test xtask
        run: cargo test -p xtask

      - name: Test default tier
        run: cargo xtask test default

      - name: Test contract tier
        run: cargo xtask test contract

  extractor-compat:
    name: Extractor Compatibility
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Download the previous release binary
        run: |
          set -euo pipefail
          tag="$(gh release list --repo "$GITHUB_REPOSITORY" \
            --exclude-drafts --exclude-pre-releases --limit 1 \
            --json tagName --jq '.[0].tagName')"
          if [ -z "$tag" ]; then
            echo "no published release to compare extraction output against" >&2
            exit 1
          fi
          echo "comparing extraction output against $tag"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern '*x86_64-unknown-linux-gnu.tar.gz' --dir previous-release
          tar -xzf previous-release/*x86_64-unknown-linux-gnu.tar.gz -C previous-release
          chmod +x previous-release/dist/x86_64-unknown-linux-gnu/julie-extract

      - name: Check extraction output compatibility
        run: >-
          cargo xtask compat-check --previous-binary
          previous-release/dist/x86_64-unknown-linux-gnu/julie-extract

      - name: Upload extraction dumps
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: compat-check-dumps
          path: target/compat-check/*.dump.txt
          if-no-files-found: warn

  windows-capacity-store:
    name: Windows Capacity Store Probe
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test native filesystem capacity
        run: cargo test -p julie-extract-cli capacity_tests --lib

      - name: Test store import with a local path
        run: >-
          cargo test -p julie-extract-cli --test store_import_contract
          public_store_import_reaches_the_production_executor -- --exact

      # The scoped-resolution path is Windows-fragile and was NEVER executed here until 2026-08-13.
      # std::fs::canonicalize returns the verbatim \\?\C:\... spelling on Windows only, and the URI
      # builder turned that into file://%3F/C:/... — so every scoped resolve failed with
      # "invalid uri authority: %3F" and no view could leave `converging`. That shipped in v2.32.0,
      # v2.32.1 and v2.33.0 while CI stayed green, because this suite is feature-gated AND was
      # missing from this job. It is not decorative: 7 of its 24 tests fail against the pre-fix code.
      # Runtime is ~70s. Do not drop it to save that.
      #
      # --test-threads=1 is REQUIRED, not a tuning knob, and must match the xtask contract tier in
      # xtask/src/test_tiers.rs: every case launches a real extractor subprocess, so the default
      # thread count runs one extractor per core against one machine. That is outside what the
      # suite is built for, and it fails as `busy: store writer lease fencing check failed` — a
      # harness overload that looks exactly like a product defect. This job ran without it once and
      # produced that false signal.
      - name: Test store resolution contract (Windows scoped-resolve gate)
        run: >-
          cargo test -p julie-extract-cli
          --features test-store-resolution-contract
          --test store_resolution_contract
          -- --test-threads=1
