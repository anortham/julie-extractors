name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  fast-gates:
    name: Fast Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: cargo fmt --check

      - name: Check workspace metadata
        run: cargo metadata --format-version 1

      - name: Test xtask
        run: cargo test -p xtask

      - name: Test default tier
        run: cargo xtask test default

      - name: Test contract tier
        run: cargo xtask test contract
