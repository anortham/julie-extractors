name: Performance Floor

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  writer-floor:
    name: Writer Throughput Floor
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run writer performance floor
        run: cargo xtask test perf
