name: Release Binaries

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version to publish
        required: true
        default: 2.38.1
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exe_suffix: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            exe_suffix: ""
          - os: macos-15-intel
            target: x86_64-apple-darwin
            exe_suffix: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe_suffix: ".exe"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Resolve release version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$DISPATCH_VERSION"
          else
            version="${REF_NAME#v}"
          fi

          if [[ -z "$version" ]]; then
            echo "release version resolved to an empty value" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify manual release tag target
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          EXPECTED_SHA="${{ github.sha }}"
          TAG_SHA="$(git ls-remote --tags origin "refs/tags/${TAG}^{}" | cut -f1)"
          if [[ -z "$TAG_SHA" ]]; then
            TAG_SHA="$(git ls-remote --tags origin "refs/tags/${TAG}" | cut -f1)"
          fi

          if [[ -n "$TAG_SHA" && "$TAG_SHA" != "$EXPECTED_SHA" ]]; then
            echo "release tag ${TAG} points at ${TAG_SHA}, but this workflow is running ${EXPECTED_SHA}" >&2
            echo "Move or delete ${TAG} before re-dispatching this release version." >&2
            exit 1
          fi

      - name: Run release preflight
        run: cargo xtask release preflight --version "${{ steps.version.outputs.version }}"

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p julie-extract-cli --bin julie-extract

      - name: Stage release package
        shell: bash
        run: |
          cargo xtask release package \
            --version "${{ steps.version.outputs.version }}" \
            --target "${{ matrix.target }}" \
            --out-dir "target/release-package/v${{ steps.version.outputs.version }}-${{ matrix.target }}" \
            --binary "target/${{ matrix.target }}/release/julie-extract${{ matrix.exe_suffix }}"

      - name: Create release archive
        id: archive
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PACKAGE_DIR="target/release-package/v${VERSION}-${{ matrix.target }}"

          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            ARCHIVE="julie-extract-v${VERSION}-${{ matrix.target }}.zip"
            (cd "$PACKAGE_DIR" && 7z a "$GITHUB_WORKSPACE/$ARCHIVE" .)
          else
            ARCHIVE="julie-extract-v${VERSION}-${{ matrix.target }}.tar.gz"
            tar -czf "$ARCHIVE" -C "$PACKAGE_DIR" .
          fi

          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.archive.outputs.archive }}
          path: ${{ steps.archive.outputs.archive }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Resolve release version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$DISPATCH_VERSION"
          else
            version="${REF_NAME#v}"
          fi

          if [[ -z "$version" ]]; then
            echo "release version resolved to an empty value" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify manual release tag target
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          EXPECTED_SHA="${{ github.sha }}"
          TAG_SHA="$(git ls-remote --tags origin "refs/tags/${TAG}^{}" | cut -f1)"
          if [[ -z "$TAG_SHA" ]]; then
            TAG_SHA="$(git ls-remote --tags origin "refs/tags/${TAG}" | cut -f1)"
          fi

          if [[ -n "$TAG_SHA" && "$TAG_SHA" != "$EXPECTED_SHA" ]]; then
            echo "release tag ${TAG} points at ${TAG_SHA}, but this workflow is running ${EXPECTED_SHA}" >&2
            echo "Move or delete ${TAG} before re-dispatching this release version." >&2
            exit 1
          fi

      - name: Run release preflight
        run: cargo xtask release preflight --version "${{ steps.version.outputs.version }}"

      - name: Prepare release notes
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NOTES_PATH="docs/release-notes/v${VERSION}.md"

          if [[ ! -f "$NOTES_PATH" ]]; then
            echo "missing release notes: $NOTES_PATH" >&2
            exit 1
          fi

          cp "$NOTES_PATH" release-notes.md

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "julie-extract v${VERSION}" \
              --notes-file release-notes.md
          else
            create_args=()
            if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
              create_args+=(--target "$GITHUB_SHA")
            else
              create_args+=(--verify-tag)
            fi

            gh release create "$TAG" \
              "${create_args[@]}" \
              --title "julie-extract v${VERSION}" \
              --notes-file release-notes.md
          fi

      - name: Upload Release Assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          mapfile -d '' files < <(find artifacts -type f -print0 | sort -z)
          if [[ "${#files[@]}" -eq 0 ]]; then
            echo "no release archives were downloaded" >&2
            exit 1
          fi

          for file in "${files[@]}"; do
            echo "Uploading $(basename "$file")..."
            gh release upload "v${VERSION}" "$file" --clobber
          done

      - name: Verify Release
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Release v${VERSION} created or updated successfully"
          echo ""
          echo "Bundled binary: julie-extract"
          echo ""
          echo "Platforms built:"
          echo "  - Windows (x86_64-pc-windows-msvc)"
          echo "  - macOS Apple Silicon (aarch64-apple-darwin)"
          echo "  - macOS Intel (x86_64-apple-darwin)"
          echo "  - Linux (x86_64-unknown-linux-gnu)"
          echo ""
          echo "View release: https://github.com/${{ github.repository }}/releases/tag/v${VERSION}"
