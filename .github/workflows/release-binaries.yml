name: Release Binaries

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version to stage
        required: true
        default: 0.1.0
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: target/release/julie-extract
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: target/release/julie-extract
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: target/release/julie-extract.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve release version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$DISPATCH_VERSION"
          else
            version="${REF_NAME#v}"
          fi

          if [[ -z "$version" ]]; then
            echo "release version resolved to an empty value" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        run: cargo build --release -p julie-extract-cli --bin julie-extract

      - name: Stage release package
        shell: bash
        run: |
          cargo xtask release package \
            --version "${{ steps.version.outputs.version }}" \
            --target "${{ matrix.target }}" \
            --out-dir "target/release-package/v${{ steps.version.outputs.version }}-${{ matrix.target }}" \
            --binary "${{ matrix.binary }}"

      - name: Upload release package
        uses: actions/upload-artifact@v6
        with:
          name: julie-extract-v${{ steps.version.outputs.version }}-${{ matrix.target }}
          path: target/release-package/v${{ steps.version.outputs.version }}-${{ matrix.target }}
          if-no-files-found: error
