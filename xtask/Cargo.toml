[package]
name = "xtask"
version = "2.0.0"
edition = "2024"
license = "MIT"
rust-version.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
julie-extract-artifact = { path = "../crates/julie-extract-artifact" }
rusqlite = { version = "0.40.0", default-features = false, features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.23.0"
