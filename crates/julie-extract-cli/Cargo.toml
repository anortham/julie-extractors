[package]
name = "julie-extract-cli"
version = "2.31.4"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Command-line interface for julie-extract artifacts"

[[bin]]
name = "julie-extract"
path = "src/main.rs"

[lib]
name = "julie_extract_cli"
path = "src/lib.rs"

[features]
# Feature-gated performance harness (`tests/resolution_perf.rs`). Intentionally
# slow / synthetic-scale, so it is kept out of the default suite by the test-tier
# convention (guarded by `tests/perf_gate_convention.rs`). Run on demand with:
#   cargo test -p julie-extract-cli --features test-perf --test resolution_perf -- --nocapture
test-perf = []
# Feature-gated real-world corpus gate (`tests/erlang_corpus.rs`). Scans the
# vendored hex.pm Erlang packages under `fixtures/real-world/erlang/` with the real
# CLI, so it is kept out of the default suite by the same test-tier convention as
# `test-perf`. Feature name matches `julie-extractors`'s real-world gate. Run with:
#   cargo test -p julie-extract-cli --features test-real-world --test erlang_corpus -- --nocapture
test-real-world = []
# Feature-gated heavy contract suites (`tests/deep_recursion_contract.rs`,
# `tests/reference_site_identity.rs`). Both spawn the real CLI against large
# generated fixtures (~80s combined on hosted runners), so they are kept out of
# the default suite by the same test-tier convention and run from the xtask
# contract tier. Run on demand with:
#   cargo test -p julie-extract-cli --features test-heavy-contracts --test deep_recursion_contract
#   cargo test -p julie-extract-cli --features test-heavy-contracts --test reference_site_identity
test-heavy-contracts = []
# Feature-gated store process/crash/equivalence contracts. The artifact feature
# exposes only integration-test crash harnesses; normal binaries have no hook.
test-store-contract = ["julie-extract-artifact/test-store-crash"]
test-store-maintenance-contract = [
    "test-store-contract",
    "julie-extract-artifact/test-store-maintenance-contract",
]
# Real-CLI legacy resolution oracle; run from `cargo xtask test contract` with
# one test thread because each case launches an extractor subprocess.
test-store-resolution-contract = [
    "test-store-contract",
    "julie-extract-artifact/test-store-resolution",
]

[lints]
workspace = true

[dependencies]
blake3 = "1.8"
clap = { version = "4.5.53", features = ["derive"] }
fs4 = "1.1.0"
# Randomness for `rebind`'s new artifact_id. Already in the lock graph via
# blake3 -> rand, and the OS entropy syscalls it wraps are out of reach of this
# workspace's `unsafe_code = "forbid"` lint.
getrandom = "0.4.2"
ignore = "0.4"
julie-extract-artifact = { path = "../julie-extract-artifact" }
julie-extractors = { path = "../julie-extractors" }
rayon = "1.10"
rusqlite = { version = "0.40.0", default-features = false, features = ["bundled"] }
# File identity for the --progress-file/--db collision guard. Already in the lock
# graph via ignore -> walkdir, and it reaches GetFileInformationByHandle on
# Windows, which `unsafe_code = "forbid"` puts out of this workspace's reach.
same-file = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
tempfile = "3.23.0"
