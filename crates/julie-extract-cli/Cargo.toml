[package]
name = "julie-extract-cli"
version = "2.6.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Command-line interface for julie-extract artifacts"

[[bin]]
name = "julie-extract"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
blake3 = "1.8"
clap = { version = "4.5.53", features = ["derive"] }
ignore = "0.4"
julie-extract-artifact = { path = "../julie-extract-artifact" }
julie-extractors = { path = "../julie-extractors" }
rayon = "1.10"
rusqlite = { version = "0.40.0", default-features = false, features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
tempfile = "3.23.0"
