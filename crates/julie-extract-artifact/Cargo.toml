[package]
name = "julie-extract-artifact"
version = "2.40.5"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "SQLite artifact persistence for julie-extract"

[features]
# Feature-gated performance harness kept out of the default suite by the
# test-tier convention. Run with:
#   cargo test -p julie-extract-artifact --features test-perf --test writer_perf -- --nocapture
test-perf = []
test-takeover = []
test-store-crash = []
test-store-maintenance-contract = ["test-store-crash"]
test-store-contract = []

[lints]
workspace = true

[dependencies]
getrandom = "0.4.2"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
rusqlite = { version = "0.40.0", default-features = false, features = ["bundled", "cache", "limits"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.4", default-features = false, features = ["process"] }

[target.'cfg(windows)'.dependencies]
machine-uid = "=0.6.0"
winsafe = { version = "=0.0.29", default-features = false, features = ["kernel"] }

[dev-dependencies]
julie-extract-artifact = { path = ".", features = ["test-store-contract"] }
